<div class="chat-widget">

  @if (!isOpen()) {

    <button
      type="button"
      class="chat-widget__launcher"
      aria-label="Abrir asistente virtual"
      (click)="toggle()"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M21 11.5a8.38 8.38 0 0 1-.9
             3.8 8.5 8.5 0 0 1-7.6
             4.7 8.38 8.38 0 0 1-3.8-.9
             L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8
             8.5 8.5 0 0 1 4.7-7.6
             8.38 8.38 0 0 1 3.8-.9h.5
             a8.48 8.48 0 0 1 8 8z"
        />
      </svg>

      <span class="chat-widget__launcher-dot"></span>
    </button>

  } @else {

    <aside
      class="chat-widget__panel"
      aria-label="Asistente virtual Serenidad"
    >

      <header class="chat-widget__header">

        <div class="chat-widget__identity">

          <div class="chat-widget__avatar">
            S
          </div>

          <div>
            <strong>
              Serenidad
            </strong>

            <span>
              <i></i>
              Asistente virtual
            </span>
          </div>

        </div>

        <div class="chat-widget__actions">

          <button
            type="button"
            title="Nueva conversación"
            aria-label="Nueva conversación"
            (click)="clearChat()"
          >
            ↻
          </button>

          <button
            type="button"
            title="Cerrar"
            aria-label="Cerrar chat"
            (click)="close()"
          >
            ×
          </button>

        </div>

      </header>


      <div
        #messagesContainer
        class="chat-widget__messages"
      >

        @for (
          message of messages();
          track message.id
        ) {

          <div
            class="chat-widget__message"
            [class.chat-widget__message--user]="
              message.role === 'user'
            "
          >

            <div class="chat-widget__bubble">
              {{ message.text }}
            </div>

          </div>

        }


        @if (loading()) {

          <div class="chat-widget__message">

            <div
              class="
                chat-widget__bubble
                chat-widget__typing
              "
              aria-label="Serenidad está escribiendo"
            >

              <span></span>
              <span></span>
              <span></span>

            </div>

          </div>

        }

      </div>


      @if (messages().length === 1) {

        <div class="chat-widget__suggestions">

          <button
            type="button"
            (click)="
              sendQuickMessage(
                'Últimamente siento mucha ansiedad'
              )
            "
          >
            Ansiedad
          </button>

          <button
            type="button"
            (click)="
              sendQuickMessage(
                'Quiero mejorar mi autoestima'
              )
            "
          >
            Autoestima
          </button>

          <button
            type="button"
            (click)="
              sendQuickMessage(
                'Quiero pedir una cita'
              )
            "
          >
            Pedir una cita
          </button>

        </div>

      }


      <form
        class="chat-widget__form"
        (ngSubmit)="send()"
      >

        <textarea
          [formControl]="messageControl"
          maxlength="1200"
          rows="1"
          placeholder="Escribe tu mensaje..."
          aria-label="Mensaje"
          (keydown.enter)="onEnter($event)"
        ></textarea>

        <button
          type="submit"
          class="chat-widget__send"
          [disabled]="
            loading() ||
            messageControl.invalid
          "
          aria-label="Enviar mensaje"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M22 2 11 13"
            />

            <path
              d="m22 2-7 20-4-9-9-4Z"
            />
          </svg>
        </button>

      </form>


      <footer class="chat-widget__footer">
        Orientación general.
        No sustituye atención profesional.
      </footer>

    </aside>

  }

</div>
